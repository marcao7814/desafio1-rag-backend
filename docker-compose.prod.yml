services:

  # Nome "ragdb" (não "db") de propósito: este container entra também na rede
  # externa "ead_default" (só para o "web" alcançar o Ollama compartilhado), e
  # o projeto EAD também tem um serviço chamado "db" nessa mesma rede — com os
  # dois usando o alias genérico "db", a resolução de nome fica ambígua e pode
  # acabar conectando no Postgres ERRADO (já aconteceu: psycopg resolveu "db"
  # para o Postgres do EAD em vez do deste projeto). Nome único evita a colisão.
  ragdb:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
    # Sem "ports" publicada propositalmente — o Postgres não deve ser acessível pela internet

  web:
    build: .
    container_name: rag-web
    restart: always
    expose:
      - "5000"
    env_file: .env
    depends_on:
      ragdb:
        condition: service_healthy
    networks:
      - default
      - proxy_net
      - ead_default
    # proxy_net: rede do nginx compartilhado da VPS (ver documentos/config/infra-nginx/),
    #            que alcança este serviço pelo nome "rag-web".
    # ead_default: rede do projeto EAD — usada só para falar com o container
    #              "ead-ollama-1" (Ollama compartilhado). Usamos o container_name
    #              explícito, não o alias de serviço "ollama", pelo mesmo motivo
    #              do comentário acima em "ragdb".

volumes:
  rag_pgdata:

networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
  ead_default:
    external: true
    name: ead_default
