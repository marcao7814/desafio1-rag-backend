server {
    listen 80;
    server_name rag.2-25-71-176.sslip.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rag.2-25-71-176.sslip.io;

    server_tokens off;
    client_max_body_size 60M;

    ssl_certificate     /etc/letsencrypt/live/rag.2-25-71-176.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.2-25-71-176.sslip.io/privkey.pem;

    # LLM_PROVIDER=ollama em CPU pode demorar bem mais que o padrão de 60s.
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://rag-web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
